<!-- SVG displacement filter for the liquid-glass CTA. Lives at root so it can
     be referenced by backdrop-filter via url(#liquid-glass-distort). -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
  <defs>
    <filter id="liquid-glass-distort" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="noise" />
      <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
      <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="60" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<div id="root"></div>
